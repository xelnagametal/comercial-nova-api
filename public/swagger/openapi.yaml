openapi: 3.0.3
info:
  title: Comercial Nova API
  version: 1.0.0
  description: |
    API REST del sistema comercial (maestros de usuarios, roles, categorías, clientes y productos).

    **Autenticación:** obtén un token con `POST /login` y pulsa **Authorize** pegando solo el token
    (Swagger añade el prefijo `Bearer`). Usuario de prueba del seeder: `admin@example.com` / `password`.

    **Permisos:** cada acción de los maestros exige el permiso `{recurso}.{accion}`
    (`ver`, `crear`, `editar`, `eliminar`). Sin él la API responde 403. Los usuarios reciben
    permisos solo a través de sus roles; los permisos de cada rol se gestionan en `/roles`.
servers:
  - url: /api
    description: Mismo host que sirve esta documentación

tags:
  - name: Autenticación
  - name: Usuarios
  - name: Roles
  - name: Permisos
  - name: Categorías
  - name: Clientes
  - name: Productos

security:
  - bearerAuth: []

paths:
  /login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión y obtener un token
      description: Limitado a 6 intentos por minuto. Usuarios inactivos o eliminados no pueden iniciar sesión.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email, example: admin@example.com }
                password: { type: string, format: password, example: password }
                device_name: { type: string, maxLength: 255, example: swagger }
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  token: { type: string, example: '1|abcdef0123456789' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me:
    get:
      tags: [Autenticación]
      summary: Usuario autenticado con sus roles y permisos
      responses:
        '200':
          description: Usuario dueño del token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /logout:
    post:
      tags: [Autenticación]
      summary: Revocar el token actual
      responses:
        '204': { description: Token revocado }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /users:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      description: 'Permiso: `usuarios.ver`. Ordenados por nombre.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Usuarios]
      summary: Crear usuario
      description: 'Permiso: `usuarios.crear`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UserInput'
                - required: [password, password_confirmation]
      responses:
        '201': { $ref: '#/components/responses/UserItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{user}:
    parameters:
      - { name: user, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Usuarios]
      summary: Ver usuario
      description: 'Permiso: `usuarios.ver`.'
      responses:
        '200': { $ref: '#/components/responses/UserItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Usuarios]
      summary: Actualizar usuario
      description: |
        Permiso: `usuarios.editar`. La contraseña es opcional (si se omite se conserva).
        `roles` es la lista completa: reemplaza los roles actuales (quitar uno = no enviarlo).
        Un administrador no puede quitarse a sí mismo el rol `administrador` (409).
        Si `activo` pasa a `false` se revocan sus tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200': { $ref: '#/components/responses/UserItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Usuarios]
      summary: Eliminar usuario (borrado lógico)
      description: 'Permiso: `usuarios.eliminar`. Revoca sus tokens. No se puede eliminar el propio usuario (409).'
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /roles:
    get:
      tags: [Roles]
      summary: Listar roles
      description: 'Permiso: `roles.ver`. Ordenados por nombre, con sus permisos y cantidad de usuarios.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Página de roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Role' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Roles]
      summary: Crear rol
      description: 'Permiso: `roles.crear`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201': { $ref: '#/components/responses/RoleItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /roles/{role}:
    parameters:
      - { name: role, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Roles]
      summary: Ver rol
      description: 'Permiso: `roles.ver`.'
      responses:
        '200': { $ref: '#/components/responses/RoleItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Roles]
      summary: Actualizar rol
      description: |
        Permiso: `roles.editar`. `permisos` es la lista completa: reemplaza los permisos actuales
        y afecta de inmediato a todos los usuarios con el rol. El rol `administrador` no se puede editar (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200': { $ref: '#/components/responses/RoleItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Roles]
      summary: Eliminar rol
      description: 'Permiso: `roles.eliminar`. Responde 409 si es `administrador` o si tiene usuarios asignados.'
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /permisos:
    get:
      tags: [Permisos]
      summary: Catálogo de permisos agrupado por recurso
      description: |
        Permiso: `permisos.ver`. Solo lectura y sin paginar: los permisos se definen en el código
        porque cada uno protege una ruta. Útil para pintar la matriz de permisos de un rol.
      responses:
        '200':
          description: Permisos agrupados por recurso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PermisoGrupo' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /categorias:
    get:
      tags: [Categorías]
      summary: Listar categorías
      description: 'Permiso: `categorias.ver`. Ordenadas por nombre.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Página de categorías
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Categoria' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Categorías]
      summary: Crear categoría
      description: 'Permiso: `categorias.crear`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaInput' }
      responses:
        '201': { $ref: '#/components/responses/CategoriaItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categorias/{categoria}:
    parameters:
      - { name: categoria, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Categorías]
      summary: Ver categoría
      description: 'Permiso: `categorias.ver`.'
      responses:
        '200': { $ref: '#/components/responses/CategoriaItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Categorías]
      summary: Actualizar categoría
      description: 'Permiso: `categorias.editar`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaInput' }
      responses:
        '200': { $ref: '#/components/responses/CategoriaItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Categorías]
      summary: Eliminar categoría (borrado lógico)
      description: 'Permiso: `categorias.eliminar`. Responde 409 si la categoría tiene productos.'
      responses:
        '204': { description: Eliminada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      description: 'Permiso: `clientes.ver`. Ordenados por nombre.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Página de clientes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Cliente' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Clientes]
      summary: Crear cliente
      description: 'Permiso: `clientes.crear`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteInput' }
      responses:
        '201': { $ref: '#/components/responses/ClienteItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /clientes/{cliente}:
    parameters:
      - { name: cliente, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Clientes]
      summary: Ver cliente
      description: 'Permiso: `clientes.ver`.'
      responses:
        '200': { $ref: '#/components/responses/ClienteItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Clientes]
      summary: Actualizar cliente
      description: 'Permiso: `clientes.editar`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteInput' }
      responses:
        '200': { $ref: '#/components/responses/ClienteItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Clientes]
      summary: Eliminar cliente (borrado lógico)
      description: 'Permiso: `clientes.eliminar`. Sus facturas se conservan.'
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /productos:
    get:
      tags: [Productos]
      summary: Listar productos
      description: 'Permiso: `productos.ver`. Incluye la categoría; ordenados por nombre.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Producto' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Productos]
      summary: Crear producto
      description: 'Permiso: `productos.crear`. Se crea con stock 0 (el stock entra por movimientos de inventario).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoInput' }
      responses:
        '201': { $ref: '#/components/responses/ProductoItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /productos/{producto}:
    parameters:
      - { name: producto, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Productos]
      summary: Ver producto
      description: 'Permiso: `productos.ver`.'
      responses:
        '200': { $ref: '#/components/responses/ProductoItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Productos]
      summary: Actualizar producto (bloqueo optimista)
      description: |
        Permiso: `productos.editar`. Envía la `version` leída; si otro usuario lo modificó antes
        responde 409. Cada actualización exitosa incrementa la versión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProductoInput'
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, example: 1 }
      responses:
        '200': { $ref: '#/components/responses/ProductoItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Productos]
      summary: Eliminar producto (borrado lógico)
      description: 'Permiso: `productos.eliminar`.'
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de Sanctum devuelto por `POST /login`.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: Tamaño de página, acotado entre 1 y 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }

  schemas:
    Timestamps:
      type: object
      properties:
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    User:
      allOf:
        - type: object
          properties:
            id: { type: integer, example: 1 }
            name: { type: string, example: Administrador }
            email: { type: string, format: email, example: admin@example.com }
            activo: { type: boolean, example: true }
            roles: { type: array, items: { type: string }, example: [administrador] }
            permisos: { type: array, items: { type: string }, example: [categorias.ver, clientes.ver] }
        - $ref: '#/components/schemas/Timestamps'
    UserInput:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, maxLength: 255, example: Ana Pérez }
        email: { type: string, format: email, maxLength: 255, example: ana@example.com }
        password: { type: string, format: password, minLength: 8, example: secreto123 }
        password_confirmation: { type: string, format: password, example: secreto123 }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          description: Lista completa de roles del usuario (nombres existentes en `GET /roles`).
          items: { type: string }
          example: [vendedor]
        activo: { type: boolean, example: true }

    Role:
      allOf:
        - type: object
          properties:
            id: { type: integer, example: 2 }
            name: { type: string, example: vendedor }
            permisos: { type: array, items: { type: string }, example: [categorias.ver, clientes.ver] }
            users_count: { type: integer, example: 20 }
        - $ref: '#/components/schemas/Timestamps'
    RoleInput:
      type: object
      required: [name, permisos]
      properties:
        name: { type: string, maxLength: 255, description: Único, example: supervisor }
        permisos:
          type: array
          uniqueItems: true
          description: Lista completa de permisos del rol (puede ir vacía). Nombres de `GET /permisos`.
          items: { type: string }
          example: [productos.ver, productos.crear]

    PermisoGrupo:
      type: object
      properties:
        recurso: { type: string, example: productos }
        permisos:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, example: 17 }
              name: { type: string, example: productos.crear }
              accion: { type: string, example: crear }

    Categoria:
      allOf:
        - type: object
          properties:
            id: { type: integer, example: 1 }
            nombre: { type: string, example: Bebidas }
        - $ref: '#/components/schemas/Timestamps'
    CategoriaInput:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, maxLength: 255, description: Único, example: Bebidas }

    Cliente:
      allOf:
        - type: object
          properties:
            id: { type: integer, example: 1 }
            tipo_identificacion: { type: string, enum: [RUC, CEDULA, PASAPORTE], example: CEDULA }
            identificacion: { type: string, example: '0102030405' }
            nombre: { type: string, example: Juan Torres }
            email: { type: string, format: email, nullable: true, example: juan@example.com }
            telefono: { type: string, nullable: true, example: '0991234567' }
            direccion: { type: string, nullable: true, example: Av. Amazonas y Colón }
            activo: { type: boolean, example: true }
        - $ref: '#/components/schemas/Timestamps'
    ClienteInput:
      type: object
      required: [tipo_identificacion, identificacion, nombre]
      properties:
        tipo_identificacion: { type: string, enum: [RUC, CEDULA, PASAPORTE], example: CEDULA }
        identificacion:
          type: string
          description: 'Única. CEDULA: 10 dígitos · RUC: 13 dígitos · PASAPORTE: alfanumérico, máx. 20.'
          example: '0102030405'
        nombre: { type: string, maxLength: 255, example: Juan Torres }
        email: { type: string, format: email, maxLength: 255, nullable: true, example: juan@example.com }
        telefono: { type: string, maxLength: 20, nullable: true, example: '0991234567' }
        direccion: { type: string, maxLength: 255, nullable: true, example: Av. Amazonas y Colón }
        activo: { type: boolean, example: true }

    Producto:
      allOf:
        - type: object
          properties:
            id: { type: integer, example: 1 }
            codigo: { type: string, example: PRD-001 }
            nombre: { type: string, example: Agua 500 ml }
            precio: { type: string, description: Decimal con 2 cifras, example: '0.75' }
            porcentaje_iva: { type: string, description: Decimal con 2 cifras, example: '15.00' }
            stock: { type: integer, example: 0 }
            version: { type: integer, example: 1 }
            activo: { type: boolean, example: true }
            categoria: { $ref: '#/components/schemas/Categoria' }
        - $ref: '#/components/schemas/Timestamps'
    ProductoInput:
      type: object
      required: [categoria_id, codigo, nombre, precio, porcentaje_iva]
      properties:
        categoria_id: { type: integer, description: Categoría existente y no eliminada, example: 1 }
        codigo: { type: string, maxLength: 50, description: Único, example: PRD-001 }
        nombre: { type: string, maxLength: 255, example: Agua 500 ml }
        precio: { type: number, minimum: 0, maximum: 9999999999.99, description: Hasta 2 decimales, example: 0.75 }
        porcentaje_iva: { type: number, enum: [0, 15], example: 15 }
        activo: { type: boolean, example: true }

    Paginated:
      type: object
      properties:
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer, example: 1 }
            from: { type: integer, nullable: true, example: 1 }
            last_page: { type: integer, example: 1 }
            path: { type: string }
            per_page: { type: integer, example: 15 }
            to: { type: integer, nullable: true, example: 15 }
            total: { type: integer, example: 1 }

    Message:
      type: object
      properties:
        message: { type: string }

  responses:
